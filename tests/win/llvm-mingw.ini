# Cross-build the Windows port on Linux with llvm-mingw against an MSYS2
# ucrt64 sysroot (tests/win/msys2-sysroot.py). Paths come from the
# constants; override them on the command line if yours differ:
#   meson setup build-win --cross-file tests/win/llvm-mingw.ini \
#     -Dsysroot=... (or edit below)
[constants]
toolchain = '/home/ayush/.local/opt/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-'
sysroot = '/home/ayush/.cache/nexchat-win/ucrt64'

[binaries]
c = toolchain + 'clang'
cpp = toolchain + 'clang++'
ar = toolchain + 'ar'
strip = toolchain + 'strip'
windres = toolchain + 'windres'
pkg-config = 'pkg-config'
exe_wrapper = 'wine'

[properties]
pkg_config_libdir = sysroot + '/lib/pkgconfig'

[built-in options]
c_args = ['-I' + sysroot + '/include']
c_link_args = ['-L' + sysroot + '/lib']
cpp_args = ['-I' + sysroot + '/include']
cpp_link_args = ['-L' + sysroot + '/lib']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
