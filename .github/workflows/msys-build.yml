name: MSYS2 Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  msys2_build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        gtk: ['3', '4']
    name: msys2_build (gtk${{ matrix.gtk }})
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-python-cffi
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-gtk${{ matrix.gtk }}
            mingw-w64-ucrt-x86_64-gtk-update-icon-cache
            mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-openssl

      - name: Configure
        run: >-
          meson build
          -Dgtk=${{ matrix.gtk }}
          -Dtext-frontend=true
          -Ddbus=disabled
          -Dwith-upd=false
          -Dwith-perl=false

      - name: Build
        run: ninja -C build

      - name: Test
        run: ninja -C build test

      - name: Install
        run: ninja -C build install
