name: macOS Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  macos_build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive    # subprojects/maya, for the TUI

      - name: Dependencies
        # coreutils: the tests' `timeout` (not on macOS). GTK itself comes
        # from osx/build-gtk.sh below, as in the app nexchat ships.
        # cmake: maya (the TUI); pyte: the TUI's pty tests
        run: |
          brew install meson ninja pkg-config openssl@3 gettext adwaita-icon-theme coreutils cmake \
            librsvg gdk-pixbuf glib pango cairo harfbuzz graphene libepoxy jpeg-turbo libpng libtiff sassc
          python3 -m pip install --break-system-packages pyte

      # GTK with nexchat's fixes (osx/gtk-patches), built once per patch set:
      # Homebrew's 4.24 has frame-timing and surface-freeze bugs of its own
      # that the GUI tests trip over now and then
      - uses: actions/cache@v4
        id: gtk
        with:
          path: ~/.cache/nexchat-gtk
          key: gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('osx/build-gtk.sh', 'osx/gtk-patches/*') }}
      - name: GTK
        if: steps.gtk.outputs.cache-hit != 'true'
        run: sh osx/build-gtk.sh

      - name: Configure
        run: >-
          meson setup build
          -Dtext-frontend=true
          -Dtui=enabled
          -Ddbus=disabled
          -Dwith-upd=false
          -Dwith-perl=false
          -Dwith-python=false
          -Dwith-lua=false
          -Dplugin=false
          "-Dpkg_config_path=$HOME/.cache/nexchat-gtk/lib/pkgconfig"

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: App bundle
        run: |
          ninja -C build app
          sh osx/check-app.sh build/nexchat.app
