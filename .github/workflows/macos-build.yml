name: macOS Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# a newer push to the same branch replaces a run still going (runners,
# the macOS one above all, are the bottleneck)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos_build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive    # subprojects/maya, for the TUI

      - name: Dependencies
        # coreutils: the tests' `timeout` (not on macOS). GTK itself comes
        # from osx/build-gtk.sh below, as in the app nexchat ships.
        # cmake: maya (the TUI); pyte: the TUI's pty tests
        run: |
          brew install meson ninja pkg-config openssl@3 gettext adwaita-icon-theme coreutils cmake \
            librsvg gdk-pixbuf glib pango cairo harfbuzz graphene libepoxy jpeg-turbo libpng libtiff sassc
          python3 -m pip install --break-system-packages pyte

      # GTK with nexchat's fixes (osx/gtk-patches), built once per patch set:
      # Homebrew's 4.24 has frame-timing and surface-freeze bugs of its own
      # that the GUI tests trip over now and then. Restored and saved as
      # separate steps: actions/cache only saves when the whole job passes,
      # so one failing test meant building GTK again (4 min) every run
      - uses: actions/cache/restore@v4
        id: gtk
        with:
          path: ~/.cache/nexchat-gtk
          key: gtk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('osx/build-gtk.sh', 'osx/gtk-patches/*') }}
      - name: GTK
        if: steps.gtk.outputs.cache-hit != 'true'
        run: sh osx/build-gtk.sh
      - uses: actions/cache/save@v4
        if: steps.gtk.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/nexchat-gtk
          key: ${{ steps.gtk.outputs.cache-primary-key }}

      # compiled objects kept between runs: meson uses ccache when it finds it
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-latest
          max-size: 500M

      - name: Configure
        run: >-
          meson setup build
          -Dtext-frontend=true
          -Dtui=enabled
          -Ddbus=disabled
          -Dwith-upd=false
          -Dwith-perl=false
          -Dwith-python=false
          -Dwith-lua=false
          -Dplugin=false
          "-Dpkg_config_path=$HOME/.cache/nexchat-gtk/lib/pkgconfig"

      - name: Build
        run: ninja -C build

      - name: Test
        # a test whose nexchat crashes prints where (fe-gtk.c crash_trace)
        env:
          NEXCHAT_CRASH_TRACE: 1
        run: meson test -C build --print-errorlogs

      # the step log above is cut short; the whole thing (every test's
      # output, untrimmed) to download from the run page
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-testlog
          path: build/meson-logs/testlog.txt
          retention-days: 7

      - name: Crash reports
        if: failure()
        run: |
          # a test that crashed: macOS writes the backtrace here
          for f in ~/Library/Logs/DiagnosticReports/nexchat*; do
            [ -e "$f" ] || continue
            echo "== $f"; head -c 20000 "$f"
          done

      - name: App bundle
        run: |
          ninja -C build app
          sh osx/check-app.sh build/nexchat.app
