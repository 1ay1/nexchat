name: Flatpak Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  flatpak_build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: nexchat.flatpak
        manifest-path: flatpak/io.github.nexchat.json
