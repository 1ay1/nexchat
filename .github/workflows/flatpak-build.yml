name: Flatpak Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# a newer push to the same branch replaces a run still going (runners,
# the macOS one above all, are the bottleneck)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak_build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # /var/lib/flatpak on its own volume (filled from the image): on some
      # runner hosts the overlay filesystem returns EXDEV when flatpak
      # updates the image's preinstalled SDK ("Invalid cross-device link")
      options: --privileged --volume /var/lib/flatpak
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: nexchat.flatpak
        manifest-path: flatpak/io.github.nexchat.json
