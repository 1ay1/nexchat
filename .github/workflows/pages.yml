name: Website
# Publishes site/ to GitHub Pages (https://1ay1.github.io/nexchat/), with
# the README screenshots copied in, whenever either changes on master.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git log for the sitemap's lastmod

      - name: Assemble
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # the sitemap's lastmod: the last commit that touched the site
          sed -i "s/@LASTMOD@/$(git log -1 --format=%cs -- site docs/screenshots)/" _site/sitemap.xml
          touch _site/.nojekyll

      - name: Check
        run: |
          # every local file the page references exists (srcset lists too)
          grep -oE '(src|href|srcset|imagesrcset)="[^"#:]+"' _site/index.html | cut -d'"' -f2 |
            tr ',' '\n' | awk '{print $1}' | sort -u |
            while read -r f; do test -e "_site/$f" || { echo "missing: $f"; exit 1; }; done
          # the structured data parses, and its FAQ answers are the page's
          # own (Google ignores FAQ data that differs from the visible text)
          python3 - <<'EOF'
          import re, json, html
          s = open('_site/index.html').read()
          d = json.loads(re.search(r'<script type="application/ld\+json">(.*?)</script>', s, re.S).group(1))
          strip = lambda x: html.unescape(re.sub('<[^>]+>', '', x)).strip()
          page = {strip(q): strip(a) for q, a in re.findall(r'<dt>(.*?)</dt>\s*<dd>(.*?)</dd>', s, re.S)}
          for g in d['@graph']:
              if g['@type'] == 'FAQPage':
                  for q in g['mainEntity']:
                      assert page.get(q['name']) == q['acceptedAnswer']['text'], 'FAQ data differs from the page: ' + q['name']
          EOF
          grep -q '<lastmod>20' _site/sitemap.xml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
