name: Website
# Publishes site/ to GitHub Pages (https://1ay1.github.io/nexchat/), with
# the README screenshots copied in, whenever either changes on master.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/screenshots/nexchat-light.png docs/screenshots/nexchat-dark.png _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
