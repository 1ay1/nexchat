name: Ubuntu Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ubuntu_build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libcanberra-dev libglib2.0-dev libgtk-3-dev libluajit-5.1-dev libpci-dev libperl-dev libssl-dev python3-dev python3-cffi mono-devel desktop-file-utils gettext xvfb x11-apps libxtst6 libenchant-2-2 hunspell-en-us python3-gi dbus xdotool x11-utils openbox

      - name: Configure
        run: meson build -Dtext-frontend=true -Dtheme-manager=true -Dauto_features=enabled

      - name: Build
        run: ninja -C build

      # gtkcompat.h's GTK4 branch must keep compiling and give GTK3's
      # packing semantics (phase 4 step 1: code moves to it while on GTK3)
      - name: gtkcompat against GTK4
        run: |
          sudo apt-get install -y libgtk-4-dev
          cc $(pkg-config --cflags gtk4) -I src/fe-gtk -o gtkcompat4 tests/gtkcompat-test.c $(pkg-config --libs gtk4)
          xvfb-run -a ./gtkcompat4
          cc $(pkg-config --cflags gtk4) -I src/fe-gtk -o nxmenu4 tests/nxmenu-test.c src/fe-gtk/nxmenu.c $(pkg-config --libs gtk4)
          xvfb-run -a ./nxmenu4

      # every frontend file must keep compiling against GTK4 except the ones
      # not ported yet (listed here; the list only shrinks)
      - name: GTK4 branches compile
        run: |
          todo="sexy-iso-codes.c tray-backend-statusicon.c chanview-tabs.c chanview-tree.c"
          for p in src/fe-gtk/*.c; do
            f=$(basename $p)
            case " $todo " in *" $f "*) continue;; esac
            echo "$f"
            cc -fsyntax-only -w -Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion \
              -DGTK_DISABLE_DEPRECATED -DGDK_DISABLE_DEPRECATED \
              -I build -I build/src/fe-gtk -I build/src/common -I src/common -I src/fe-gtk -I src $(pkg-config --cflags gtk4 openssl) $p
          done

      - name: Test
        run: ninja -C build test

      - name: Install
        run: sudo ninja -C build install

  # the GTK4 build (-Dgtk=4): it must build, and the tests that run on it
  # (smoke-gui: connect + join + render with criticals fatal, the compat
  # unit tests) must pass
  ubuntu_gtk4:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libglib2.0-dev libgtk-4-dev libssl-dev python3 desktop-file-utils gettext xvfb x11-apps libxtst6 libenchant-2-2 hunspell-en-us python3-gi dbus xdotool x11-utils openbox fonts-dejavu-core

      - name: Configure
        run: meson build4 -Dgtk=4 -Dtext-frontend=false -Dwith-perl=false -Dwith-python=false -Dwith-lua=false -Dlibcanberra=disabled

      - name: Build
        run: ninja -C build4

      - name: Test
        run: meson test -C build4 --print-errorlogs
