name: Ubuntu Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ubuntu_build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libcanberra-dev libdbus-glib-1-dev libglib2.0-dev libgtk-3-dev libluajit-5.1-dev libpci-dev libperl-dev libssl-dev python3-dev python3-cffi mono-devel desktop-file-utils gettext xvfb x11-apps libxtst6

      - name: Configure
        run: meson build -Dtext-frontend=true -Dtheme-manager=true -Dauto_features=enabled

      - name: Build
        run: ninja -C build

      # gtkcompat.h's GTK4 branch must keep compiling and give GTK3's
      # packing semantics (phase 4 step 1: code moves to it while on GTK3)
      - name: gtkcompat against GTK4
        run: |
          sudo apt-get install -y libgtk-4-dev
          cc $(pkg-config --cflags gtk4) -I src/fe-gtk -o gtkcompat4 tests/gtkcompat-test.c $(pkg-config --libs gtk4)
          xvfb-run -a ./gtkcompat4

      # the files whose GTK4 branches are written (input, drag and drop, the
      # chat view) must keep compiling against GTK4 until the switch
      - name: GTK4 branches compile
        run: |
          for f in gtkevents.c gtkdnd.c xtext.c; do
            cc -fsyntax-only -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
              -DGTK_DISABLE_DEPRECATED -DGDK_DISABLE_DEPRECATED \
              -I build -I build/src/fe-gtk -I src/common -I src/fe-gtk -I src $(pkg-config --cflags gtk4 openssl) src/fe-gtk/$f
          done

      - name: Test
        run: ninja -C build test

      - name: Install
        run: sudo ninja -C build install
