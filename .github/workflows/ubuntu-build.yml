name: Ubuntu Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # every feature on (plugins, text frontend, theme manager), and the tests
  # (smoke-gui: connect + join + render with criticals fatal, the compat
  # unit tests, X11 + Wayland runs) must pass
  ubuntu_build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive    # subprojects/maya (+ its jaal), for the TUI

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libcanberra-dev libglib2.0-dev libgtk-4-dev libluajit-5.1-dev libpci-dev libperl-dev libssl-dev python3-dev python3-cffi mono-devel desktop-file-utils gettext xvfb x11-apps libxtst6 libenchant-2-2 hunspell-en-us python3-gi dbus xdotool x11-utils openbox weston sway libwayland-dev wayland-protocols fonts-dejavu-core cmake g++-14 python3-pyte

      - name: Configure
        # g++-14: maya (the TUI) is C++23
        run: CXX=g++-14 meson build -Dtext-frontend=true -Dtheme-manager=true -Dauto_features=enabled

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Install
        run: sudo ninja -C build install
